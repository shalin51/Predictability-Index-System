[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amfpi-prediction-server"
version = "0.1.0"
description = "Independent formulation outcome prediction and optimization API"
requires-python = ">=3.11"
dependencies = [
  "catboost>=1.2.8,<2",
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
